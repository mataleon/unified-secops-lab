name: Validate detections

on:
  push:
    paths: ["modules/**/*.yaml", "tools/validate_rules.py", ".github/workflows/validate-detections.yml"]
  pull_request:
    paths: ["modules/**/*.yaml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tools/validate_rules.py modules
