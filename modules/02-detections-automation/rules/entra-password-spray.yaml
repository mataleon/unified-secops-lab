id: 747f4529-a9e8-423d-b8cf-96396e14d566
name: VCBHN - Entra ID password spray from a single IP
description: |
  One IP address with failed sign-ins (bad password or locked) against 10+ distinct accounts in 1 hour.
  Successful sign-ins from the same IP are surfaced because they may be compromised accounts.
severity: High
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110.003
query: |
  SigninLogs
  | where ResultType in ("50126", "50053", "0")
  | summarize TargetedUsers = dcountif(UserPrincipalName, ResultType != "0"),
              FailedAttempts = countif(ResultType != "0"),
              SuccessfulUsers = make_set_if(UserPrincipalName, ResultType == "0", 20),
              Apps = make_set(AppDisplayName, 10),
              StartTime = min(TimeGenerated), EndTime = max(TimeGenerated)
      by IPAddress
  | where TargetedUsers >= 10
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
customDetails:
  TargetedUsers: TargetedUsers
  FailedAttempts: FailedAttempts
version: 1.0.0
kind: Scheduled
